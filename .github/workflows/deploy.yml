name: Publier l'add-in sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Compiler l'add-in
        working-directory: outlook
        env:
          NODE_OPTIONS: --openssl-legacy-provider --no-experimental-fetch
        run: |
          npm install --no-audit --no-fund
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          npx webpack --mode production --https false --env.DOMAIN="${OWNER}.github.io"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outlook/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
